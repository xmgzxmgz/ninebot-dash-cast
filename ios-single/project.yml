name: SingleCast
options:
  bundleIdPrefix: local.singlecast
  deploymentTarget:
    iOS: "16.4"
  createIntermediateGroups: true

packages:
  BigInt:
    url: https://github.com/attaswift/BigInt
    from: 5.3.0

targets:
  SingleCast:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: SingleCast
        CFBundleShortVersionString: "0.5"
        CFBundleVersion: "5"
        UILocalNotificationUsageDescription: 用于后台保活提示
        NSLocalNetworkUsageDescription: 用于向九号仪表发送投屏数据（UDP 5012/5013）
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
    dependencies:
      - package: BigInt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.singlecast
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        CODE_SIGNING_ALLOWED: NO
