name: protocol-tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: pip install -r tools/requirements.txt
      - name: 协议单元测试（逐字节断言，不联网）
        run: python tools/test_protocol.py
      - name: 打包器语法检查
        run: python -m compileall -q tools
